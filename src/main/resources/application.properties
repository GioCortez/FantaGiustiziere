server.port=${PORT:5000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Leave fanta.filePath blank to start in web mode (no computation on startup).
# Set it to a local path to run automatically on startup (legacy/test mode).
fanta.filePath=
fanta.players=12
fanta.home-advantage=2
fanta.permutation-limit=5000
# 1 = single-thread | -1 = auto (availableProcessors) | N = fixed pool
fanta.threads=-1

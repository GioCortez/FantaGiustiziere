<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>FantaGiustiziere — Il calendario era contro di te. Forse.</title>
  <meta name="description" content="Scopri se il calendario del tuo Fantacalcio era davvero contro di te. Analisi statistica su tutte le possibili combinazioni di calendari.">
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="FantaGiustiziere">
  <meta property="og:locale"      content="it_IT">
  <meta property="og:url"         content="https://PRODUCTION_URL/">
  <meta property="og:title"       content="FantaGiustiziere — Il calendario era contro di te. Forse.">
  <meta property="og:description" content="Scopri se il calendario del tuo Fantacalcio era davvero contro di te. Analisi statistica su tutte le possibili combinazioni di calendari.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { overflow-x: hidden; }

    /* ── Fixed top bar ──────────────────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(3, 10, 5, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(247,201,72,0.12);
      z-index: 500;
      transition: background 0.3s;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .topbar-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      color: #f7c948;
      text-shadow: 0 0 14px rgba(247,201,72,0.4);
    }
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .topbar-link {
      padding: 0.4rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(140,175,140,0.75);
      text-decoration: none;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.03em;
    }
    .topbar-link:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }
    .topbar-cta {
      padding: 0.4rem 1.1rem;
      background: #f7c948;
      color: #0a0e16;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 6px;
      letter-spacing: 0.04em;
      transition: background 0.15s;
      margin-left: 0.5rem;
      white-space: nowrap;
    }
    .topbar-cta:hover { background: #fad86a; }
    @media (max-width: 600px) {
      .topbar-nav { display: none; }
      .topbar-cta { display: none; }
    }

    /* ── Hero ───────────────────────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 7rem 1.5rem 4rem;
      position: relative;
    }

    .hero-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(247,201,72,0.6);
      margin-bottom: 1.5rem;
      animation: fadeUp 0.8s ease both;
    }

    .hero-logo {
      display: block;
      width: clamp(400px, 94vw, 1050px);
      height: auto;
      margin: 0 auto 2rem;
      animation: fadeUp 0.8s ease 0.1s both;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
    }

    .hero-tagline {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      font-style: italic;
      font-weight: 400;
      color: #f1f5f9;
      line-height: 1.3;
      max-width: 700px;
      margin: 0 auto 0.75rem;
      animation: fadeUp 0.8s ease 0.2s both;
      text-shadow:
        0 0 25px rgba(255,255,255,0.30),
        0 0 60px rgba(255,255,255,0.12),
        0 3px 12px rgba(0,0,0,1);
    }
    .hero-tagline em {
      color: #f7c948;
      font-style: italic;
      text-shadow:
        0 0 20px rgba(247,201,72,0.75),
        0 0 55px rgba(247,201,72,0.35),
        0 3px 12px rgba(0,0,0,1);
    }

    .hero-sub {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: clamp(1.05rem, 2.8vw, 1.5rem);
      font-weight: 400;
      color: #cbd5e1;
      text-shadow:
        0 0 20px rgba(255,255,255,0.15),
        0 2px 10px rgba(0,0,0,1);
      margin-bottom: 3rem;
      animation: fadeUp 0.8s ease 0.3s both;
    }

    .hero-cta-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.8s ease 0.4s both;
    }

    .cta-primary {
      padding: 0.9rem 2.5rem;
      background: #f7c948;
      color: #0a0e16;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: 0.04em;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(247,201,72,0.3);
    }
    .cta-primary:hover {
      background: #fad86a;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(247,201,72,0.45);
    }

    .cta-secondary {
      padding: 0.9rem 2rem;
      background: transparent;
      color: #94a3b8;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      transition: color 0.15s, background 0.15s;
    }
    .cta-secondary:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- Football pitch SVG background -->

    <line x1="700" y1="60" x2="700" y2="840"/>
    <circle cx="700" cy="450" r="110"/>
    <rect x="60"   y="219" width="200" height="462"/>
    <rect x="60"   y="345" width="67"  height="210"/>
    <rect x="1140" y="219" width="200" height="462"/>
    <rect x="1273" y="345" width="67"  height="210"/>

    <path d="M 1140 538 A 110 110 0 0 1 1140 362"/>

    <path d="M 1320 840 A 20 20 0 0 1 1340 820"/>
    <rect x="16"   y="388" width="44" height="124" stroke="rgba(255,255,255,0.22)"/>
    <rect x="1340" y="388" width="44" height="124" stroke="rgba(255,255,255,0.22)"/>
  </g>
  <g fill="rgba(255,255,255,0.40)">
    <circle cx="700"  cy="450" r="5"/>
    <circle cx="194"  cy="450" r="5"/>
    <circle cx="1206" cy="450" r="5"/>
  </g>
  <rect width="1400" height="900" fill="url(#fl1)"/>
  <rect width="1400" height="900" fill="url(#fl2)"/>
  <rect width="1400" height="900" fill="url(#cg)"/>
  <rect width="1400" height="900" fill="url(#vig)"/>
</svg>

<!-- Floating bonus numbers -->
<div class="bonus-layer" aria-hidden="true"></div>

<!-- Top bar -->
<header class="topbar">
  <a href="index.html" class="topbar-brand">
    <img src="logo.png" alt="FantaGiustiziere" style="height:36px;width:auto;"/>

  <nav class="topbar-nav">
    <a href="info.html"    class="topbar-link">📐 Come funziona</a>

<!-- ── Hero ──────────────────────────────────────────────────────────────── -->
<section class="hero">
  <p class="hero-eyebrow">Fantacalcio · Analisi del Calendario</p>

  <svg class="hero-logo" viewBox="0 0 1220 330" xmlns="http://www.w3.org/2000/svg" aria-label="FantaGiustiziere">
    <rect x="1" y="1" width="1218" height="328" rx="14" fill="rgba(10,14,22,0.75)" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
    <defs>
      <filter id="hl-glow-y" x="-5%" y="-50%" width="110%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>

      <filter id="hl-glow-g" x="-5%" y="-50%" width="110%" height="200%">

    <image href="favicon.png" x="87" y="10" width="310" height="310"/>
    <rect x="435" y="25" width="5" height="280" fill="#f7c948" opacity="0.8" rx="2"/>
    <text x="472" y="133"
          text-anchor="start"
          font-family="'Bebas Neue', sans-serif"

          stroke="rgba(255,255,255,0.35)"

  <p class="hero-sub">Scoprilo con i dati — non con le lamentele.</p>
  <div class="hero-cta-group">
    <a href="app.html"  class="cta-primary">⚡ Analizza il mio calendario</a>
    <a href="info.html" class="cta-secondary">Come funziona</a>
  </div>
</section>
